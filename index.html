<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#11151b;--panel:#1a2029;--line:#2b3441;--fg:#e7eaef;--muted:#8b95a5;
  --board:#1b2c47;--board-edge:#13203a;--hole:#0b0f15;
  --p1:#f0683a;--p1d:#a8401c;--p1l:#ffb08f;
  --p2:#43b4cc;--p2d:#1f6f81;--p2l:#a6e6f2;
  --stone:#6f7886;--frost:#9fd3ff;--gold:#f2c14e;--danger:#ff5d5d;
  --fd:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --fb:'Barlow',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;margin:0;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:0}
h2{font-family:var(--fd);font-size:22px;margin:0;text-wrap:balance}
.muted{color:var(--muted);margin:0}
.eyebrow{font-family:var(--fd);font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.c1{color:var(--p1)}.c2{color:var(--p2)}
.err{color:var(--danger);margin:0;min-height:1.3em}
.banner{background:#3a2a12;border:1px solid var(--gold);color:var(--gold);border-radius:10px;padding:8px 12px;font-size:14px}

.timer{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.tbar{width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--fg);transition:width .25s linear}
.timer.warn .tbar i{background:var(--danger)}.timer.warn{color:var(--danger)}
.timer.off .tbar{display:none}

.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pl.on{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.pl[data-p="1"]{--pc:var(--p1)}.pl[data-p="2"]{--pc:var(--p2)}
.pl .nm{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.pl .nm b{color:var(--pc)}
.pl .turn{font-size:11px;color:var(--bg);background:var(--pc);padding:1px 6px;border-radius:4px}
.pips{display:flex;gap:3px;align-items:center}
.pips i{width:11px;height:8px;border-radius:2px;background:var(--line)}
.pips i.f{background:var(--pc)}
.pips span{margin-left:6px;font-family:var(--fd);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lo{font-size:12px;color:var(--muted);line-height:1.35}

.status{margin:0;min-height:2.7em;font-size:15px;line-height:1.35}
.status b{font-weight:600}

.board-wrap{position:relative}
.board{background:var(--board);border-radius:14px;padding:6px;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;box-shadow:inset 0 -5px 0 var(--board-edge);overflow:hidden;isolation:isolate}
.col{display:grid;grid-template-rows:repeat(7,auto);gap:3px;padding:2px;border-radius:9px;position:relative;cursor:pointer}
.col.can:hover{background:rgba(255,255,255,.07)}
.col.tgt{box-shadow:0 0 0 2px var(--gold) inset;background:rgba(242,193,78,.08)}
.col.frz::after{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;
  background:repeating-linear-gradient(135deg,rgba(159,211,255,.22) 0 6px,rgba(159,211,255,.06) 6px 12px);box-shadow:0 0 0 2px var(--frost) inset}
.cell{aspect-ratio:1;border-radius:50%;background:var(--hole);position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.cell.tgt{box-shadow:0 0 0 2px var(--gold)}
.cell.sel{box-shadow:0 0 0 3px var(--fg)}
.disc{position:absolute;inset:7%;border-radius:50%}
.d1{background:radial-gradient(circle at 34% 30%,var(--p1l),var(--p1) 45%,var(--p1d))}
.d2{background:radial-gradient(circle at 34% 30%,var(--p2l),var(--p2) 45%,var(--p2d))}
.d3{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),transparent 55%),repeating-linear-gradient(45deg,#7b818b 0 3px,#5d636c 3px 6px);box-shadow:inset 0 0 0 2px #454a52}
.anc::after{content:"";position:absolute;inset:24%;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.last::before{content:"";position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.75)}
.fall{animation:fall .42s linear}
@keyframes fall{
  0%{transform:translateY(var(--from));animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  70%{transform:translateY(0) scale(1.06,.9);animation-timing-function:ease-out}
  85%{transform:translateY(-8%) scale(.98,1.03);animation-timing-function:ease-in}
  100%{transform:none}}
/* Pop: bottom disc bursts before the column drops */
.burst{animation:burst .4s ease-out forwards}
@keyframes burst{30%{transform:scale(1.3);filter:brightness(2)}100%{transform:scale(1.6);opacity:0;filter:brightness(2.5)}}
/* Lift: disc rises out of the board */
.lift-out{animation:liftout .55s cubic-bezier(.3,0,.7,1) forwards}
@keyframes liftout{20%{transform:scale(1.1)}100%{transform:translateY(-320%) scale(.8);opacity:0}}
/* Swap: discs slide past each other */
.slide{animation:slide .45s cubic-bezier(.4,0,.2,1);z-index:3}
@keyframes slide{from{transform:translate(var(--sx),var(--sy)) scale(1.1)}to{transform:none}}
/* Anchor: gold ring stamps down */
.anc-in::after{animation:stamp .5s cubic-bezier(.3,1.5,.5,1)}
.anc-in{animation:thud .5s ease-out}
@keyframes stamp{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
@keyframes thud{40%{transform:scale(.9)}100%{transform:none}}
/* Freeze: frost sweeps down the column */
.col.frz-in::after{animation:frost .6s ease-out}
@keyframes frost{from{clip-path:inset(0 0 100% 0);filter:brightness(2.5)}to{clip-path:inset(0 0 0 0)}}
/* Double Drop: gold pulse around the board */
.board.dd-flash{animation:ddflash .7s ease-out}
@keyframes ddflash{0%{box-shadow:inset 0 -5px 0 var(--board-edge),0 0 0 0 var(--gold)}35%{box-shadow:inset 0 -5px 0 var(--board-edge),0 0 0 4px var(--gold),0 0 24px 6px rgba(242,193,78,.5)}100%{box-shadow:inset 0 -5px 0 var(--board-edge),0 0 0 0 transparent}}
.board.won .cell:not(.win) .disc{opacity:.28;filter:grayscale(.6);transition:opacity .4s,filter .4s}
.cell.win{z-index:1}
.cell.win::after{content:"";position:absolute;inset:-2px;border-radius:50%;box-shadow:0 0 0 3px var(--gold),0 0 18px 4px var(--gold);opacity:0;animation:ring .3s ease-out forwards;animation-delay:var(--wd)}
.cell.win .disc{animation:winpop .45s cubic-bezier(.3,1.6,.5,1) both,pulse .7s ease-in-out infinite alternate;animation-delay:var(--wd),calc(var(--wd) + .5s)}
@keyframes winpop{0%{transform:scale(1)}50%{transform:scale(1.35);filter:brightness(1.8)}100%{transform:scale(1.08)}}
@keyframes ring{to{opacity:1}}
@keyframes pulse{from{transform:scale(1.08)}to{filter:brightness(1.5);transform:scale(1.16)}}
.col.flip1{animation:spin .55s ease-in-out forwards;z-index:2;box-shadow:0 0 0 2px var(--gold) inset}
@keyframes spin{to{transform:rotate(180deg)}}
.letters{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:4px 8px 0;font-family:var(--fd);font-size:12px;color:var(--muted);text-align:center;letter-spacing:.1em}

.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.ab .an{font-family:var(--fd);font-weight:600;font-size:14px;letter-spacing:.04em}
.ab .ac{font-family:var(--fd);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ab .ad{font-size:12px;line-height:1.3;color:var(--muted)}
.ab{justify-content:flex-start}
.ab:disabled{opacity:.38;cursor:not-allowed}
.ab.armed{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;width:100%}
.primary{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:14px 16px;cursor:pointer;font-family:var(--fd);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;width:100%}
.primary:disabled,.ghost:disabled{opacity:.35;cursor:not-allowed}

.setup{display:flex;flex-direction:column;gap:12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-content:start;min-width:0}
.card .cn{font-family:var(--fd);font-weight:600;font-size:15px}
.card .cost{font-family:var(--fd);font-size:12px;color:var(--muted);align-self:center}
.card .cd{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.35}
.card.on{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.card.on .cost{color:var(--pc)}
.setup[data-p="1"]{--pc:var(--p1)}.setup[data-p="2"]{--pc:var(--p2)}
.tog{display:flex;align-items:center;gap:8px;color:var(--muted)}
.tog input{width:18px;height:18px;accent-color:var(--fg)}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--fd);font-size:20px;letter-spacing:.3em;text-transform:uppercase;text-align:center}
.field .primary{width:auto}
.code{font-family:var(--fd);font-size:44px;font-weight:700;letter-spacing:.3em;text-align:center;padding-block:8px}
.link{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;user-select:all}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-family:var(--fd);letter-spacing:.14em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,15,21,.55);border-radius:14px;z-index:10;animation:fadein .3s ease-out}
@keyframes fadein{from{opacity:0}}
.over .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;width:min(290px,88%);text-align:center}
.over h2{font-size:24px}

details{color:var(--muted);font-size:14px;line-height:1.45}
summary{cursor:pointer;font-family:var(--fd);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
details ul{padding-left:18px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.fall,.cell.win .disc,.col.flip1,.burst,.slide,.anc-in,.anc-in::after,.col.frz-in::after,.board.dd-flash{animation:none}.lift-out{display:none}}

/* ---- mode picker ---- */
.modes{display:grid;gap:8px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mode .cn{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.04em}
.mode .cd{font-size:13px;color:var(--muted);line-height:1.35}
.mode.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
/* ---- real-time mode ---- */
.mclock{font-size:20px;color:var(--fg);letter-spacing:.06em}
.mclock.warn{color:var(--danger)}
.pl .score{font-family:var(--fd);font-size:20px;color:var(--pc)}
.pips i.pt{width:18px;height:10px;border-radius:3px}
.dropbar{position:relative;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.dropbar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--p,0));background:rgba(255,255,255,.12)}
.dropbar span{position:relative}
.cdbtn{position:relative;overflow:hidden}
.cdbtn .cdfill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p,0) * 100%);background:rgba(255,255,255,.08);pointer-events:none}
.cdbtn>span{position:relative}
.disc.pend{animation:pend .25s ease-in-out infinite alternate;box-shadow:0 0 0 3px var(--gold),0 0 14px 3px var(--gold)}
@keyframes pend{to{transform:scale(1.12);filter:brightness(1.5)}}
.disc.scored{animation:scored .55s ease-out forwards;animation-delay:var(--wd,.25s)}
@keyframes scored{0%{transform:scale(1);box-shadow:0 0 0 3px var(--gold)}40%{transform:scale(1.35);filter:brightness(2);box-shadow:0 0 0 3px var(--gold),0 0 20px 6px var(--gold)}100%{transform:scale(.2);opacity:0}}
.contest{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:8;pointer-events:none;font-family:var(--fd);font-weight:700;font-size:30px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);text-shadow:0 2px 0 #000,0 0 18px rgba(242,193,78,.7);animation:contest .5s ease-out}
.contest.cancel{color:var(--fg);font-size:24px}
@keyframes contest{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.disc.pend,.disc.scored,.contest{animation:none}}

/* ---- local play ---- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ghost.strong{border-color:var(--fg);color:var(--fg)}
.small{font-size:13px}
.side{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.side[data-p="1"]{--pc:var(--p1);border-color:rgba(240,104,58,.45)}
.side[data-p="2"]{--pc:var(--p2);border-color:rgba(67,180,204,.45)}
.flipside{transform:rotate(180deg)}
.sidehead{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.sidehead .score{font-size:20px;color:var(--pc);margin-left:auto}
.sidehead .fzn{font-size:11px;color:var(--frost);text-transform:none;letter-spacing:0}
.sidehead .pips i.pt{width:14px;height:8px}
.sidehead .pips i.f{background:var(--pc)}
.droprow{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding-inline:6px}
.dropbtn{height:34px;border-radius:8px;border:0;cursor:pointer;font-family:var(--fd);font-weight:700;font-size:13px;color:#111;background:var(--pc)}
.dropbtn:disabled{opacity:.25;cursor:not-allowed}
.side .dropbar{height:22px;font-size:11px}
.side .tray .ab{padding:7px 6px}
.side .tray .ad{font-size:11px}
.tabletop-status{min-height:1.4em;text-align:center;font-size:14px}

/* Gravity Flip: the whole board turns over, then discs fall */
@keyframes gravflip{0%{transform:perspective(900px) rotateX(0)}100%{transform:perspective(900px) rotateX(180deg)}}
@media (prefers-reduced-motion:reduce){.board.grav1{animation:none}}

/* Grenade: dark shell with a blinking fuse; explosion flash and debris */
.d4{background:radial-gradient(circle at 35% 30%,#5d6470,#2a2f37 55%,#15181d);box-shadow:inset 0 0 0 2px #0c0e12}
.d4::before{content:"";position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);border-radius:50%;background:var(--danger);box-shadow:0 0 8px 2px var(--danger);animation:fuse .5s steps(2) infinite}
.d4.fuse-hot::before{animation-duration:.16s}
.d4.fuse-hot{animation:shake .12s linear infinite}
@keyframes fuse{50%{opacity:.25}}
@keyframes shake{25%{transform:translate(-3%,2%)}75%{transform:translate(3%,-2%)}}
.disc.boomed{animation:boomed .45s ease-out forwards}
@keyframes boomed{0%{filter:brightness(1)}25%{filter:brightness(3) saturate(0);transform:scale(1.2)}100%{transform:scale(.3) rotate(40deg);opacity:0}}
.blast{position:absolute;inset:-120%;border-radius:50%;pointer-events:none;z-index:4;
  background:radial-gradient(circle,#fff 0 12%,#ffd27a 22%,rgba(255,93,93,.85) 40%,rgba(255,93,93,0) 68%);animation:blast .45s ease-out forwards}
@keyframes blast{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.d4::before,.d4.fuse-hot,.disc.boomed,.blast{animation:none}}

.hdr-right{display:flex;align-items:center;gap:10px}
.exit{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-family:var(--fd);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;align-self:center}

/* Rising discs (gravity up) mirror the fall */
.rise{animation:rise .42s linear}
@keyframes rise{
  0%{transform:translateY(var(--from));animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  70%{transform:translateY(0) scale(1.06,.9);animation-timing-function:ease-out}
  85%{transform:translateY(8%) scale(.98,1.03);animation-timing-function:ease-in}
  100%{transform:none}}
.lift-out.down{animation-name:liftdown}
@keyframes liftdown{20%{transform:scale(1.1)}100%{transform:translateY(320%) scale(.8);opacity:0}}
/* Gravity flip: the board shudders before the discs fly */
.board.grav1{animation:gravshake .34s ease-in-out;box-shadow:inset 0 -5px 0 var(--board-edge),0 0 0 3px var(--gold),0 0 26px 6px rgba(242,193,78,.45)}
@keyframes gravshake{0%,100%{transform:none}20%{transform:translateY(-2%)}40%{transform:translateY(2%)}60%{transform:translateY(-1.5%)}80%{transform:translateY(1%)}}
.board.up{box-shadow:inset 0 5px 0 var(--board-edge),0 0 0 2px rgba(242,193,78,.35)}
.gravtag{font-family:var(--fd);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-align:center}
.gravtag.inline{display:inline;margin-left:6px}
/* Animations resumed part-way after a re-render */
.fall,.rise,.slide,.lift-out,.anc-in,.anc-in::after,.col.frz-in::after,.board.dd-flash{animation-delay:var(--ad,0s)}
/* Main menu confirm */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.7);padding-inline:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;width:min(320px,100%);text-align:center}
@media (prefers-reduced-motion:reduce){.rise,.board.grav1{animation:none}}

/* Fixed stone (Full Auto scored four): dark, riveted, clearly not a disc */
.d5{border-radius:12%;inset:5%;background:#cfd3da;box-shadow:inset 0 0 0 2px #aeb3bc,inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12)}
.disc.petrify{animation:petrify .85s ease-out}
@keyframes petrify{0%{filter:brightness(2.4) sepia(1) saturate(4) hue-rotate(5deg);transform:scale(1.25);box-shadow:0 0 0 3px var(--gold),0 0 22px 6px var(--gold)}60%{filter:brightness(1.4);transform:scale(1.05)}100%{filter:none;transform:none}}
/* Reinforce: the stack is shoved one step away from the floor */
.disc.push{animation:push .4s cubic-bezier(.2,.8,.3,1)}
@keyframes push{from{transform:translateY(var(--push))}to{transform:none}}
.disc.petrify,.disc.push{animation-delay:var(--ad,0s)}
.dropbar.empty{border-color:var(--danger)}
@media (prefers-reduced-motion:reduce){.disc.petrify,.disc.push{animation:none}}

/* Punch In: the disc slams into place with a shockwave */
.disc.punchin{animation:punchin .45s cubic-bezier(.2,1.4,.4,1);animation-delay:var(--ad,0s)}
@keyframes punchin{0%{transform:scale(2.2);opacity:.2;filter:brightness(2.5)}55%{transform:scale(.88);opacity:1}100%{transform:none}}
.shock{position:absolute;inset:-35%;border-radius:50%;border:3px solid var(--fg);pointer-events:none;z-index:3;opacity:0;animation:shock .5s ease-out;animation-delay:var(--ad,0s)}
@keyframes shock{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.disc.punchin,.shock{animation:none}}

/* A drop smashing a fixed stone */
.disc.shatter{z-index:4;pointer-events:none;animation:shatter .4s ease-out forwards;animation-delay:var(--ad,0s)}
@keyframes shatter{0%{transform:none;opacity:1;filter:brightness(1.6)}30%{transform:scale(1.15) rotate(-6deg);filter:brightness(2.2)}100%{transform:scale(.4) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.disc.shatter{display:none}}

/* Matchmaking radar */
.radar{position:relative;width:96px;height:96px;margin-block:8px}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);opacity:0;animation:ping 2.4s ease-out infinite}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.radar::after{content:"";position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--p1l),var(--p1) 45%,var(--p1d))}
@keyframes ping{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.radar i{animation:none;opacity:.4}}
</style>
